name: Workbench checks
# Runs on every PR and push to main so the "Workbench checks result" job always reports (it is the required check).
# A first job decides whether source changed; docs-only changes skip the native and browser jobs, and the result job
# still passes. Native lanes and browser shards run as parallel jobs, each with only the toolchains it needs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Same paths the workflow used to filter on; anything unknown counts as source.
          if [ "$EVENT" = pull_request ]; then
            gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[].filename' > files.txt
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            gh api "repos/$REPO/compare/$BEFORE...$SHA" -q '.files[].filename' > files.txt
            # The compare API lists at most 300 files; a larger push is treated as source.
            [ "$(wc -l < files.txt)" -lt 300 ] || echo ".github/forced" > files.txt
          else
            echo ".github/forced" > files.txt
          fi
          source=$(python3 - <<'PY'
          from fnmatch import fnmatch
          patterns = [".gitattributes", "src/**", "native/**", "data/**", "desktop/**", "scripts/**", "tests/**", "tools/**", "web/**",
                      "infra/**", "agentcore/**", "Dockerfile*", "package*.json", "tsconfig*.json", "vite.config.ts", "playwright.config.ts", ".github/**"]
          files = [f for f in open("files.txt").read().splitlines() if f]
          print("true" if not files or any(fnmatch(f, p) for f in files for p in patterns) else "false")
          PY
          )
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "Source changed: $source ($(wc -l < files.txt) files)"
  infrastructure:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Public repository: do not leave the job token in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - run: bash scripts/check_cpu.sh infra
  check:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node: ["24.21.0", "26.10.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: npm ci
      - run: bash scripts/check_cpu.sh core
      - name: Fetch pinned native tools and original recording
        run: npm run setup:demo
      - name: Native recording, feedback and independent handoff
        run: npm run test:native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workbench-verification-node-${{ matrix.node }}
          path: .state/evidence/native-e2e.json
          retention-days: 14
  native:
    # Native lanes run for real (Blender, CadQuery, CalculiX, MuJoCo, OR-Tools, FreeCAD CAM), one lane per job.
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: cad
            tools: { blender: "true", sandbox: "true", cadquery: "true", logistics: "true" }
            run: |
              npm run test:blender && npm run test:cad && npm run test:pillow && npm run test:artifacts && npm run test:yard
              python3 tools/slim_cadquery_lock.py --python .state/tools/cadquery-2.8.0/bin/python --check
              python3 -m pip install -q botocore==1.43.82 && python3 -m unittest discover -s tests/agentcore -p 'test_*.py'
              npm run test:cad-code
          - lane: physics
            tools: { blender: "true", sandbox: "true", cadquery: "true", physics: "true", botorch: "true", robots: "true" }
            run: npm run test:fea && npm run test:robot && npm run test:optimize && npm run test:optimize-pillow && npm run test:package && npm run test:cad-sweep && node --env-file-if-exists=.state/demo.env --import tsx --test tests/surrogate.test.ts
          - lane: cam
            tools: { cadquery: "true", cam: "true" }
            run: npm run test:cam
          # Representative industrial cases: the 5-minute CAM case D2 runs beside the rest.
          - lane: suite
            tools: { blender: "true", sandbox: "true", cadquery: "true", physics: "true", logistics: "true", cam: "true" }
            run: PAI_SUITE_SKIP=D2 npm run test:suite
          - lane: suite-cam
            tools: { blender: "true", sandbox: "true", cadquery: "true", physics: "true", logistics: "true", cam: "true" }
            run: PAI_SUITE_ONLY=D2 npm run test:suite
    env:
      PAI_BLENDER: ${{ github.workspace }}/.state/tools/blender-5.2.2-linux-x64/blender
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: npm ci
      - name: Fetch pinned native tools and original recording
        run: npm run setup:demo && npm run build
      - uses: ./.github/actions/native-toolchains
        with:
          blender: ${{ matrix.tools.blender || 'false' }}
          sandbox: ${{ matrix.tools.sandbox || 'false' }}
          cadquery: ${{ matrix.tools.cadquery || 'false' }}
          physics: ${{ matrix.tools.physics || 'false' }}
          botorch: ${{ matrix.tools.botorch || 'false' }}
          logistics: ${{ matrix.tools.logistics || 'false' }}
          cam: ${{ matrix.tools.cam || 'false' }}
          robots: ${{ matrix.tools.robots || 'false' }}
      - name: Native ${{ matrix.lane }} lane
        run: ${{ matrix.run }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workbench-native-${{ matrix.lane }}
          if-no-files-found: ignore
          path: |
            .state/evidence/*.json
            .state/browser/cad/*/*/cam-verify.json
            .state/browser/cad/*/*/cam.json
          retention-days: 14
  browser:
    # Desktop, mobile and real video decoding. Playwright shards by test count, so the long tests (@cam: CAM, the
    # CP-SAT site-admission benchmark) get their own job with only the tools they need; the rest split into three shards. Each job has its own server and state.
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: "1/3", args: "--grep-invert @cam --shard=1/3", blender: "true", sandbox: "true", physics: "true", logistics: "true", cam: "false" }
          - { shard: "2/3", args: "--grep-invert @cam --shard=2/3", blender: "true", sandbox: "true", physics: "true", logistics: "true", cam: "false" }
          - { shard: "3/3", args: "--grep-invert @cam --shard=3/3", blender: "true", sandbox: "true", physics: "true", logistics: "true", cam: "false" }
          - { shard: cam, args: "--grep @cam", blender: "false", sandbox: "false", physics: "false", logistics: "true", cam: "true" }
    name: browser (${{ matrix.shard }})
    env:
      PAI_BLENDER: ${{ matrix.blender == 'true' && format('{0}/.state/tools/blender-5.2.2-linux-x64/blender', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npm run setup:demo && npm run build
      - uses: ./.github/actions/native-toolchains
        with:
          blender: ${{ matrix.blender }}
          sandbox: ${{ matrix.sandbox }}
          cadquery: "true"
          physics: ${{ matrix.physics }}
          logistics: ${{ matrix.logistics }}
          cam: ${{ matrix.cam }}
          browser: "true"
      - name: Browser ${{ matrix.shard }}
        run: npx playwright test ${{ matrix.args }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workbench-browser-${{ strategy.job-index }}
          if-no-files-found: ignore
          path: |
            test-results/
            .state/browser/cad/*/*/cam-verify.json
            .state/browser/cad/*/*/cam.json
          retention-days: 14
  result:
    # The single required check: passes only if every job that had to run succeeded.
    name: Workbench checks result
    if: always()
    needs: [changes, infrastructure, check, native, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS"])
          source = needs["changes"]["result"] == "success" and needs["changes"]["outputs"].get("source") == "true"
          if needs["changes"]["result"] != "success":
              raise SystemExit(f"change detection {needs['changes']['result']}")
          for name, job in needs.items():
              print(f"{name}: {job['result']}")
          bad = [n for n, j in needs.items() if j["result"] in ("failure", "cancelled") or (source and j["result"] != "success")]
          if bad:
              raise SystemExit(f"not successful: {', '.join(bad)}")
          print("source changed: all checks passed" if source else "no source change: native and browser checks not needed")
          PY
