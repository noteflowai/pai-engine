name: Pinned native toolchains
description: >
  Installs the pinned, hash-checked native tools a job needs into .state/tools (the same installers users run).
  Measured on a hosted runner: Blender ~22 s, CadQuery 31 s, physics 57 s, FreeCAD CAM 42 s. They are not cached:
  the toolchains are about 11 GB unpacked, beyond the repository's 10 GB Actions cache, for at most ~2.5 min a job.
inputs:
  blender: { description: "Blender 5.2 LTS (official archive, checksum-verified)", default: "false" }
  sandbox: { description: "Bubblewrap OS sandbox for generated CAD code", default: "false" }
  cadquery: { description: "Hash-locked CadQuery 2.8 / OCCT 7.9", default: "false" }
  physics: { description: "Gmsh, CalculiX, Optuna, scikit-learn, MuJoCo and Newton", default: "false" }
  botorch: { description: "PyTorch CPU and BoTorch in the physics venv (qLogNEHVI, the structural surrogate)", default: "false" }
  logistics: { description: "Hash-locked OR-Tools", default: "false" }
  cam: { description: "FreeCAD 1.1 CAM (AppImage digest-pinned)", default: "false" }
  robots: { description: "Strands Robots (hash-locked) + MuJoCo Menagerie at the pinned commit, simulation only", default: "false" }
  browser: { description: "Playwright Chromium and its system libraries", default: "false" }
runs:
  using: composite
  steps:
    # The runner's Ubuntu mirror is sometimes very slow (measured: 30 MB in 3m46s; 21.5 MB in 8m35s). Every apt install
    # below (bubblewrap, physics libraries, Playwright's browser libraries) keeps its .deb files in one directory that is
    # cached per tool set (tens of MB). apt still checks them against the signed archive indices; a stale cache only
    # means a fresh download.
    - name: Cached apt downloads
      if: inputs.sandbox == 'true' || inputs.physics == 'true' || inputs.browser == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pai-apt
        key: pai-apt-${{ runner.os }}-${{ runner.arch }}-noble-s${{ inputs.sandbox }}-p${{ inputs.physics }}-b${{ inputs.browser }}-1
    - name: Keep apt downloads
      if: inputs.sandbox == 'true' || inputs.physics == 'true' || inputs.browser == 'true'
      shell: bash
      run: |
        mkdir -p ~/.cache/pai-apt/partial
        printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/pai-apt" \
          | sudo tee /etc/apt/apt.conf.d/99pai-download-cache >/dev/null
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      id: py312
      with:
        python-version: "3.12"
        update-environment: false
    - name: Blender
      if: inputs.blender == 'true'
      shell: bash
      run: npm run setup:native
    - name: Bubblewrap sandbox
      if: inputs.sandbox == 'true'
      shell: bash
      run: |
        sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; the sandbox needs them.
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
    - name: CadQuery
      if: inputs.cadquery == 'true'
      shell: bash
      run: '"${{ steps.py312.outputs.python-path }}" tools/setup_cadquery.py'
    - name: Physics
      if: inputs.physics == 'true'
      shell: bash
      run: |
        sudo apt-get install -y -q libglu1-mesa libgl1 libopengl0 libxcursor1 libxft2 libxinerama1 libfontconfig1 libgomp1 libopenmpi3t64
        "${{ steps.py312.outputs.python-path }}" tools/setup_physics.py --with-newton ${{ inputs.botorch == 'true' && '--with-botorch' || '' }}
    - name: OR-Tools
      if: inputs.logistics == 'true'
      shell: bash
      run: '"${{ steps.py312.outputs.python-path }}" tools/setup_logistics.py'
    - name: Strands Robots
      if: inputs.robots == 'true'
      shell: bash
      run: '"${{ steps.py312.outputs.python-path }}" tools/setup_robots.py'
    - name: FreeCAD CAM
      if: inputs.cam == 'true'
      shell: bash
      run: python3 tools/setup_cam.py
    - name: Playwright Chromium
      if: inputs.browser == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
    - name: Hand the downloaded packages to the cache
      if: inputs.sandbox == 'true' || inputs.physics == 'true' || inputs.browser == 'true'
      shell: bash
      run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/pai-apt && rm -f ~/.cache/pai-apt/lock
